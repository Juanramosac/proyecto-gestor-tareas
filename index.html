<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestor de tareas</title>
</head>
<body>
<div id="contenedor-principal">
    <h1>Mi Gestor de Tareas</h1>
    <div id="panel-control">
        <input id="input-tarea" type="text" placeholder="Escribe una nueva tarea...">
        <button id="btn-agregar">Agregar Tarea</button>
    </div>
    <div id="tablero">
        <div id="lista-tareas" class="columna">
            <h2>LISTA DE TAREAS</h2>
                <div class="tarjeta-tarea">
                </div>
        </div>
        <div id="tareas-proceso" class="columna">
            <h2>TAREAS EN PROCESO</h2>
        </div>

        <div id="tareas-finalizadas" class="columna">
            <h2>TAREAS FINALIZADAS</h2>
        </div>
    </div>
</div>  
<script src="script.js"></script>
</body>
</html>
